spring:
  application:
    name: demo-ai
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

server:
  port: 8123
  servlet:
    context-path: /api

# SpringDoc OpenAPI 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match:
        - /**
      packages-to-scan:
        - com.yupi.yuaiagent.controller
